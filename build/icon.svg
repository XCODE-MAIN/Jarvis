<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%">
      <stop offset="0" stop-color="#202024"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="j" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d6d6da"/>
      <stop offset="1" stop-color="#7c7c84"/>
    </linearGradient>
    <radialGradient id="orb" cx="34%" cy="28%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#cfcfd3"/>
      <stop offset="1" stop-color="#3a3a40"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="3"/>
  <!-- J: haste + gancho numa só linha -->
  <path d="M316 118 V286 C316 346 280 388 224 388 C190 388 164 372 148 346"
        fill="none" stroke="url(#j)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- reflexo na haste -->
  <path d="M300 130 V270" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  <!-- esfera: o ponto do Jarvis, a flutuar à esquerda da haste -->
  <circle cx="186" cy="150" r="34" fill="url(#orb)"/>
  <ellipse cx="175" cy="138" rx="12" ry="7" fill="#fff" fill-opacity="0.7" transform="rotate(-30 175 138)"/>
</svg>
